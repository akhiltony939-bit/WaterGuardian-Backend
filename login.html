<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
WaterGuardian-X | Citizen Login
</title>


<link rel="icon" href="images/logo.png">


<link rel="stylesheet" href="css/theme.css">

<link rel="stylesheet" href="css/loading.css">

<link rel="stylesheet" href="css/login.css">


</head>



<body>


<!-- Loader -->

<div id="loader">

<div class="loader-content">

<div class="water-drop">
💧
</div>

<h1>
WaterGuardian-X
</h1>

<p>
Citizen Portal Login
</p>

</div>

</div>






<div class="login-container">


<div class="login-card">



<img src="images/logo.png"
class="login-logo">



<h1>
💧 WaterGuardian-X
</h1>


<p>
Citizen Smart Water Portal
</p>






<form id="loginForm">



<label>
Email
</label>


<input
type="email"
id="email"
placeholder="Enter email"
required>







<label>
Password
</label>



<div class="password-box">


<input
type="password"
id="password"
placeholder="Enter password"
required>



<button
type="button"
id="showPassword">

👁️

</button>



</div>








<div class="remember">


<input
type="checkbox"
id="remember">


<label>
Remember me
</label>


</div>








<button type="submit">

Login

</button>






<p id="message"></p>






<p>

New citizen?

<a href="register.html">

Create Account

</a>

</p>





<a href="index.html">

⬅ Back Home

</a>




</form>



</div>


</div>






<script src="js/login.js"></script>

<script src="js/theme.js"></script>

<script src="js/loading.js"></script>


</body>

</html>
