<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
WaterGuardian-X | Citizen Profile
</title>


<link rel="stylesheet" href="css/theme.css">

<link rel="stylesheet" href="css/loading.css">

<link rel="stylesheet" href="css/style.css">


</head>


<body>


<!-- Loader -->

<div id="loader">

<div class="loader-content">

<div class="water-drop">
💧
</div>

<h1>
WaterGuardian-X
</h1>

<p>
Citizen Profile
</p>

</div>

</div>






<!-- Header -->

<header>

<h2>
💧 WaterGuardian-X
</h2>


<nav>

<a href="dashboard.html">
Dashboard
</a>


<a href="complaint.html">
Complaint
</a>


<a href="profile.html">
Profile
</a>


<a href="index.html">
Logout
</a>


</nav>


</header>







<section class="profile-section">


<div class="profile-card">



<div class="profile-icon">

👤

</div>



<h1>
Citizen Profile
</h1>



<div class="profile-details">


<p>

<strong>
Name:
</strong>

<span id="profileName">
Citizen
</span>

</p>





<p>

<strong>
Email:
</strong>

<span id="profileEmail">
user@email.com
</span>

</p>






<p>

<strong>
Role:
</strong>

Citizen User

</p>





<p>

<strong>
Portal:
</strong>

WaterGuardian-X Smart Water System

</p>



</div>





<button onclick="logout()">

🚪 Logout

</button>



<a href="dashboard.html">

⬅ Back to Dashboard

</a>



</div>


</section>






<script>


document.addEventListener(
"DOMContentLoaded",
()=>{


let user =

JSON.parse(
localStorage.getItem("waterUser")
);



if(user){


document.getElementById(
"profileName"
).innerHTML =
user.name;



document.getElementById(
"profileEmail"
).innerHTML =
user.email;


}


});





function logout(){


localStorage.removeItem(
"waterUser"
);


window.location.href=
"index.html";


}


</script>





<script src="js/theme.js"></script>

<script src="js/loading.js"></script>


</body>

</html>
