<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
WaterGuardian-X | Register Complaint
</title>


<link rel="icon" href="images/logo.png">


<link rel="stylesheet" href="css/theme.css">

<link rel="stylesheet" href="css/loading.css">

<link rel="stylesheet" href="css/complaint.css">


</head>



<body>



<div id="loader">

<div class="loader-content">

<div class="water-drop">
💧
</div>


<h1>
WaterGuardian-X
</h1>


<p>
Citizen Complaint Portal
</p>


</div>

</div>







<div class="complaint-container">



<div class="complaint-card">



<img src="images/logo.png"
class="complaint-logo">



<h1>
💧 WaterGuardian-X
</h1>


<p>
Register Water Related Problems
</p>






<form id="complaintForm">



<label>
Citizen Name
</label>


<input

type="text"

id="name"

placeholder="Enter your name"

required>



<label>
Complaint Category
</label>


<select id="category">


<option>
🚰 Water Leakage
</option>


<option>
💧 Water Quality Problem
</option>


<option>
🚱 No Water Supply
</option>


<option>
🔧 Pipeline Damage
</option>


<option>
🏭 Water Pollution
</option>


</select>







<label>
Location
</label>



<div class="location-box">


<input

type="text"

id="location"

placeholder="Enter location"

required>



<button

type="button"

id="locationBtn">

📍 GPS

</button>


</div>









<label>
Upload Image
</label>


<input

type="file"

id="image"

accept="image/*">







<label>
Complaint Description
</label>


<textarea

id="description"

placeholder="Explain your problem"

required></textarea>







<button type="submit">

🚀 Submit Complaint

</button>






<p id="message"></p>





<a href="dashboard.html">

⬅ Back Dashboard

</a>



</form>





</div>


</div>








<script src="js/complaint.js"></script>

<script src="js/theme.js"></script>

<script src="js/loading.js"></script>


</body>

</html>
